# --- DATABASE CONFIGURATION ---
# Appends '?createDatabaseIfNotExist=true' so MySQL builds 'evershine_db' automatically if it's missing!
spring.datasource.url=jdbc:mysql://localhost:3306/evershine_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=pass@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HIBERNATE PERSISTENCE CONFIGURATION ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' strategy reads your entity annotations and creates/updates columns dynamically
spring.jpa.hibernate.ddl-auto=update

# --- DEBUGGING LOGS ---
# Prints clearly formatted SQL queries inside your IDE console panel
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
